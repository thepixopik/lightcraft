<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The AllCraft Light</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="The AllCraft Light: open-source photo library and RAW developer, running locally in your browser.">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1c1c1c; }
    canvas#lightcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #lightcraft_loading {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #b8b8b8; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; pointer-events: none;
    }
    #lightcraft_status { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; overflow: hidden; }
  </style>
</head>
<body>
  <canvas id="lightcraft_canvas"></canvas>
  <div id="lightcraft_loading">
    <div style="margin-bottom:12px;font-size:15px;font-weight:600;color:#ececef">Loading The AllCraft Light&hellip;</div>
    <div style="width:240px;height:5px;background:#323238;border-radius:999px;overflow:hidden">
      <div id="lc_load_bar" style="width:2%;height:100%;background:#06b6d4;border-radius:999px;transition:width 0.12s ease-out"></div>
    </div>
    <div id="lc_load_pct" style="margin-top:8px;font-size:12px;color:#9ca3af;font-variant-numeric:tabular-nums">Starting&hellip;</div>
  </div>
  <div id="lightcraft_status" aria-live="polite"></div>
  <script type="module">
    import init, { start, command } from "./lightcraft_web.js";
    (async () => {
      const chineseFont = fetch("./lightcraft_zh_hans.otf")
        .then(async response => response.ok ? new Uint8Array(await response.arrayBuffer()) : new Uint8Array())
        .catch(() => new Uint8Array());
      const [module, font] = await Promise.all([
        WebAssembly.compileStreaming(fetch("./lightcraft_web_bg.wasm")),
        chineseFont,
      ]);
      globalThis.lightcraftModule = module;
      await init({ module_or_path: module });
      globalThis.lightcraft = { command };
      start(font);
    })().catch((e) => {
      console.error(e);
      const el = document.getElementById("lightcraft_loading");
      if (el) el.textContent = "The AllCraft Light failed to load: " + e;
    });
  </script>
</body>
</html>
